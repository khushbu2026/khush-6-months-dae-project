version: "3.8"

# n8n + Grafana only. Wazuh (Manager, Indexer, Dashboard) is deployed
# separately via the official wazuh-docker single-node stack — see
# ../README.md "Reproducing this on a new machine" for the full sequence.
#
# Usage:
#   1. Copy .env.example to .env and set real values (never commit .env)
#   2. docker compose up -d

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  grafana-data:
  n8n-data:
